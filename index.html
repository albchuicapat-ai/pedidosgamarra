<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taller Textil de Gamarra</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="script.js" defer></script>
</head>
<body data-pagina="registro">
<main class="container py-4">
  <h1>Pedidos de un taller textil de Gamarra</h1>

  <form id="textil">
    <label for="contacto" class="form-label">Nombre del contacto</label>
    <input id="contacto" name="contacto" class="form-control mb-2"
      required maxlength="70">

    <label for="correo" class="form-label">Correo</label>
    <input id="correo" name="correo" type="email" class="form-control mb-2" required>

    <label for="color" class="form-label">Color</label>
    <select id="color" name="color" class="form-select mb-2" required>
      <option value="">Selecciona</option>
      <option>Blanco</option>
      <option>Azul</option>
      <option>Negro</option>
    </select>

    <fieldset class="my-3">
      <legend class="fs-5">Distribución por tallas</legend>
      <div class="row g-3">
        <div class="col-md-4">
          <label for="s" class="form-label">Talla S</label>
          <input id="s" name="s" type="number" class="form-control"
            min="0" max="200" step="1" required>
        </div>
        <div class="col-md-4">
          <label for="m" class="form-label">Talla M</label>
          <input id="m" name="m" type="number" class="form-control"
            min="0" max="200" step="1" required>
        </div>
        <div class="col-md-4">
          <label for="l" class="form-label">Talla L</label>
          <input id="l" name="l" type="number" class="form-control"
            min="0" max="200" step="1" required>
        </div>
      </div>
    </fieldset>

    <input id="estampado" type="checkbox" name="estampado" value="estampado">
    <label for="estampado">Estampado (S/ 4 por polo)</label>

    <label for="observaciones" class="form-label mt-3">Observaciones (opcional)</label>
    <textarea id="observaciones" name="observaciones"
      class="form-control mb-3" maxlength="200" rows="2"></textarea>

    <button type="submit" class="btn btn-primary">Revisar</button>
  </form>

  <p id="mensaje" role="status"></p>
</main>
</body>
</html>
